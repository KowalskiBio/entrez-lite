        <button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">

  <footer class="container footer muted">
    Data from NCBI E-utilities and NCBI Datasets. Not affiliated with NCBI.

  <dialog id="modal">

      <h2 id="modal-title"></h2>
      <button class="icon-btn" id="modal-close" aria-label="Close">✕</button>
    </div>
    <div id="modal-body"></div>
  </dialog>
  <div id="toast" role="status"></div>
